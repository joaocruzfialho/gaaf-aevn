<!doctype html>
<html lang="pt-PT" data-bs-theme="{{ session.get('tema', 'light') }}">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sessão terminada — GAAF AEVN</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-7 col-lg-5">
            <div class="card text-center shadow-sm">
                <div class="card-body p-4">
                    <i class="bi bi-check-circle-fill text-success" style="font-size:4rem"></i>
                    <h4 class="mt-3">Sessão terminada</h4>

                    {% if allow_shutdown %}
                    <p class="text-muted">A aplicação foi encerrada com sucesso.<br>
                    Pode fechar esta janela em segurança.</p>
                    <div class="alert alert-info small mt-3 mb-0" id="aviso">
                        A aplicação será encerrada em <b id="contador">3</b> segundos…
                    </div>
                    {% else %}
                    <p class="text-muted">A sua sessão foi encerrada com segurança.</p>
                    <a href="{{ url_for('login') }}" class="btn btn-primary mt-2">
                        <i class="bi bi-box-arrow-in-right"></i> Fazer login novamente
                    </a>
                    {% endif %}
                </div>
            </div>
        </div>
    </div>
</div>
{% if allow_shutdown %}
<script>
(function () {
    let s = 3;
    const cnt = document.getElementById("contador");
    const interv = setInterval(function () {
        s--;
        if (cnt) cnt.textContent = s;
        if (s <= 0) {
            clearInterval(interv);
            fetch("{{ url_for('encerrar') }}", { method: "POST" })
                .catch(function () {})
                .finally(function () {
                    document.getElementById("aviso").innerHTML =
                        "Servidor encerrado. Pode fechar esta janela.";
                    setTimeout(function () { window.close(); }, 500);
                });
        }
    }, 1000);
})();
</script>
{% endif %}
</body>
</html>
