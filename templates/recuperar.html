{% extends "base.html" %}
{% block titulo %}Recuperar password{% endblock %}
{% block conteudo %}
<div class="row justify-content-center">
    <div class="col-12 col-md-7 col-lg-5">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h4 class="mb-3"><i class="bi bi-key"></i> Recuperar password</h4>
                {% if erro %}<div class="alert alert-danger">{{ erro }}</div>{% endif %}

                {% if passo == "1" %}
                <form method="post">
                    <input type="hidden" name="passo" value="1">
                    <div class="mb-3">
                        <label class="form-label">Email da sua conta</label>
                        <input type="email" name="email" class="form-control form-control-lg" required autofocus>
                    </div>
                    <button class="btn btn-primary w-100" type="submit">Continuar</button>
                </form>
                {% elif passo == "2" %}
                <form method="post">
                    <input type="hidden" name="passo" value="2">
                    <input type="hidden" name="email" value="{{ email }}">
                    <div class="mb-2"><small class="text-muted">Conta: <b>{{ email }}</b></small></div>
                    <div class="mb-3">
                        <label class="form-label">{{ pergunta }}</label>
                        <input type="text" name="resposta" class="form-control" required autofocus>
                    </div>
                    <button class="btn btn-primary w-100" type="submit">Validar resposta</button>
                </form>
                {% elif passo == "3" %}
                <form method="post">
                    <input type="hidden" name="passo" value="3">
                    <input type="hidden" name="email" value="{{ email }}">
                    <div class="mb-3">
                        <label class="form-label">Nova password</label>
                        <input type="password" name="password" class="form-control" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Confirmar nova password</label>
                        <input type="password" name="password2" class="form-control" required>
                    </div>
                    <button class="btn btn-success w-100" type="submit">
                        <i class="bi bi-check-circle"></i> Atualizar password
                    </button>
                </form>
                {% endif %}
                <hr>
                <a href="{{ url_for('login') }}" class="text-decoration-none">
                    <i class="bi bi-arrow-left"></i> Voltar ao login
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
